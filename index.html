<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আমার অনলাইন শপ - Headless Store</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Hind Siliguri', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">

    <!-- Header -->
    <header class="bg-white shadow-sm sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-indigo-600">🚀 আমার শপ</h1>
            <div class="text-sm bg-indigo-50 text-indigo-700 px-3 py-1.5 rounded-full font-medium">
                মোট প্রোডাক্ট: <span id="cart-count">০</span> টি
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-8">
        <div class="text-center mb-10">
            <h2 class="text-3xl font-bold mb-2">আমাদের এক্সক্লুসিভ প্রোডাক্টসমূহ</h2>
            <p class="text-gray-500">পছন্দের প্রোডাক্টটি বেছে নিন এবং সহজে অর্ডার করুন</p>
        </div>

        <!-- Product Grid -->
        <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <p class="text-center col-span-full text-gray-500 py-10">ওয়ার্ডপ্রেস ব্যাকএন্ড থেকে প্রোডাক্ট লোড হচ্ছে...</p>
        </div>
    </main>

    <!-- Custom Notification Toast (Replaces alert) -->
    <div id="toast-box" class="fixed bottom-5 right-5 bg-green-600 text-white px-6 py-4 rounded-xl shadow-lg transform translate-y-24 opacity-0 transition-all duration-300 z-50 max-w-sm">
        <p id="toast-message" class="font-medium"></p>
    </div>

    <!-- Checkout Modal -->
    <div id="checkout-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden justify-center items-center z-50 p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 relative shadow-xl">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 text-xl font-bold">×</button>
            <h3 class="text-xl font-bold mb-4">অর্ডার কনফার্ম করুন</h3>
            <p id="modal-product-name" class="text-indigo-600 font-semibold mb-4"></p>
            
            <form id="order-form" onsubmit="submitOrder(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">আপনার নাম</label>
                    <input type="text" id="cust-name" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">মোবাইল নম্বর</label>
                    <input type="tel" id="cust-phone" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">সম্পূর্ণ ঠিকানা</label>
                    <textarea id="cust-address" rows="3" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none"></textarea>
                </div>
                <button type="submit" class="w-full bg-indigo-600 text-white py-3 rounded-lg font-semibold hover:bg-indigo-700 transition">অর্ডার প্লেস করুন</button>
            </form>
        </div>
    </div>

    <!-- Script -->
    <script>
        // ফলব্যাক স্যাম্পল প্রোডাক্ট (যদি ফ্রি সার্ভার API ব্লক করে)
        const fallbackProducts = [
            { id: 101, name: "প্রিমিয়াম লেদার ওয়ালেট (Demo)", price: 1200, image: "https://images.unsplash.com/photo-1627123424574-724758594e93?auto=format&fit=crop&w=500&q=80" },
            { id: 102, name: "স্মার্ট ওয়াচ সিরিজ ৮ (Demo)", price: 3500, image: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=500&q=80" }
        ];

        let liveProducts = [];
        let selectedProduct = null;

        // ওয়ার্ডপ্রেস ব্যাকএন্ড থেকে রিয়েল প্রোডাক্ট লোড করার ফাংশন
        async function fetchProducts() {
            const grid = document.getElementById('product-grid');
            const apiUrl = 'https://myportshow.xo.je/wp-json/wc/store/v1/products';
            
            try {
                // সরাসরি এপিআই কল করার চেষ্টা
                const response = await fetch(apiUrl);
                if (!response.ok) {
                    throw new Error('সার্ভার রেসপন্স সঠিক নয়');
                }
                const data = await response.json();
                
                liveProducts = data.map(item => ({
                    id: item.id,
                    name: item.name,
                    price: item.prices && item.prices.price ? (parseFloat(item.prices.price) / 100) : 0,
                    image: item.images && item.images.length > 0 ? item.images[0].src : 'https://placehold.co/500x500/e2e8f0/475569?text=No+Image'
                }));

                renderProducts(liveProducts);
            } catch (error) {
                console.warn('সরাসরি এপিআই ব্লক হয়েছে (InfinityFree Security/CORS)। ফলব্যাক ডেটা দেখানো হচ্ছে:', error.message);
                
                // ইনফিনিটি ফ্রি বট প্রোটেকশন বা CORS এররের কারণে ব্লক হলে সুন্দর একটি নোটিশসহ ডেমো প্রোডাক্ট দেখাবে
                liveProducts = fallbackProducts;
                renderProducts(liveProducts, true);
            }
        }

        // রেন্ডার প্রোডাক্টস
        function renderProducts(productsList, isFallback = false) {
            const grid = document.getElementById('product-grid');
            
            let noticeHtml = '';
            if (isFallback) {
                noticeHtml = `
                    <div class="col-span-full bg-amber-50 border border-amber-200 text-amber-800 px-4 py-3 rounded-xl text-sm mb-2 flex flex-col sm:flex-row justify-between items-center gap-2">
                        <span>⚠️ <strong>নোট:</strong> InfinityFree ফ্রি সার্ভার সিকিউরিটি/CORS-এর কারণে লাইভ API ব্লক করেছে। নিচে ডেমো প্রোডাক্ট দেখানো হচ্ছে।</span>
                    </div>
                `;
            }

            if (productsList.length === 0) {
                grid.innerHTML = noticeHtml + '<p class="text-center col-span-full text-gray-500">কোনো প্রোডাক্ট পাওয়া যায়নি। ওয়ার্ডপ্রেসে প্রোডাক্ট পাবলিশ করুন।</p>';
                return;
            }

            grid.innerHTML = noticeHtml + productsList.map(p => `
                <div class="bg-white rounded-xl shadow-sm hover:shadow-md transition overflow-hidden border border-gray-100 flex flex-col">
                    <img src="${p.image}" alt="${p.name}" onerror="this.src='https://placehold.co/500x500/e2e8f0/475569?text=Product'" class="w-full h-48 object-cover">
                    <div class="p-4 flex flex-col flex-grow">
                        <h3 class="font-semibold text-lg mb-1">${p.name}</h3>
                        <p class="text-indigo-600 font-bold text-lg mb-4">৳ ${p.price}</p>
                        <button onclick="openModal(${p.id})" class="mt-auto w-full bg-indigo-50 text-indigo-600 hover:bg-indigo-600 hover:text-white py-2 rounded-lg font-medium transition">অর্ডার করুন</button>
                    </div>
                </div>
            `).join('');
            document.getElementById('cart-count').innerText = productsList.length;
        }

        function openModal(id) {
            selectedProduct = liveProducts.find(p => p.id === id);
            document.getElementById('modal-product-name').innerText = `নির্বাচিত প্রোডাক্ট: ${selectedProduct.name} (মূল্য: ৳ ${selectedProduct.price})`;
            document.getElementById('checkout-modal').classList.remove('hidden');
            document.getElementById('checkout-modal').classList.add('flex');
        }

        function closeModal() {
            document.getElementById('checkout-modal').classList.remove('flex');
            document.getElementById('checkout-modal').classList.add('hidden');
        }

        function showToast(msg) {
            const toast = document.getElementById('toast-box');
            document.getElementById('toast-message').innerText = msg;
            toast.classList.remove('translate-y-24', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-24', 'opacity-0');
            }, 4000);
        }

        function submitOrder(e) {
            e.preventDefault();
            const name = document.getElementById('cust-name').value;
            
            showToast(`ধন্যবাদ ${name}! আপনার অর্ডারটি সফলভাবে গৃহিত হয়েছে।`);
            
            document.getElementById('order-form').reset();
            closeModal();
        }

        // পেজ লোড হলেই এপিআই থেকে প্রোডাক্ট কল করবে
        window.onload = fetchProducts;
    </script>
</body>
</html>
