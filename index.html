<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আমার অনলাইন শপ - Headless Store</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Hind Siliguri', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">

    <!-- Header -->
    <header class="bg-white shadow-sm sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-indigo-600">🚀 আমার শপ</h1>
            <div class="text-sm bg-indigo-50 text-indigo-700 px-3 py-1.5 rounded-full font-medium">
                কার্ট: <span id="cart-count">০</span> টি প্রোডাক্ট
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-8">
        <div class="text-center mb-10">
            <h2 class="text-3xl font-bold mb-2">আমাদের এক্সক্লুসিভ প্রোডাক্টসমূহ</h2>
            <p class="text-gray-500">পছন্দের প্রোডাক্টটি বেছে নিন এবং সহজে অর্ডার করুন</p>
        </div>

        <!-- Product Grid -->
        <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- JavaScript দিয়ে প্রোডাক্টগুলো ডায়নামিকভাবে লোড হবে -->
        </div>
    </main>

    <!-- Checkout Modal -->
    <div id="checkout-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden justify-center items-center z-50 p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 relative shadow-xl">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 text-xl font-bold">×</button>
            <h3 class="text-xl font-bold mb-4">অর্ডার কনফার্ম করুন</h3>
            <p id="modal-product-name" class="text-indigo-600 font-semibold mb-4"></p>
            
            <form id="order-form" onsubmit="submitOrder(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">আপনার নাম</label>
                    <input type="text" id="cust-name" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">মোবাইল নম্বর</label>
                    <input type="tel" id="cust-phone" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">সম্পূর্ণ ঠিকানা</label>
                    <textarea id="cust-address" rows="3" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none"></textarea>
                </div>
                <button type="submit" class="w-full bg-indigo-600 text-white py-3 rounded-lg font-semibold hover:bg-indigo-700 transition">অর্ডার প্লেস করুন</button>
            </form>
        </div>
    </div>

    <!-- Script -->
    <script>
        // স্যাম্পল ১৫-২০টি প্রোডাক্টের ডাটা (পরে এটি ওয়ার্ডপ্রেস/উকমার্স API থেকে আসবে)
        const products = [
            { id: 1, name: "প্রিমিয়াম লেদার ওয়ালেট", price: 1200, image: "https://images.unsplash.com/photo-1627123424574-724758594e93?auto=format&fit=crop&w=500&q=80" },
            { id: 2, name: "স্মার্ট ওয়াচ সিরিজ ৮", price: 3500, image: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=500&q=80" },
            { id: 3, name: "ওয়্যারলেস ব্লুটুথ ইয়ারবাড", price: 1800, image: "https://images.unsplash.com/photo-1572536147248-ac59a8abfa4b?auto=format&fit=crop&w=500&q=80" },
            { id: 4, name: "স্টাইলিশ সানগ্লাস", price: 950, image: "https://images.unsplash.com/photo-1572635196237-14b3f281503f?auto=format&fit=crop&w=500&q=80" },
            { id: 5, name: "কটন ক্যাজুয়াল শার্ট", price: 1100, image: "https://images.unsplash.com/photo-1602810318383-e386cc2a3ccf?auto=format&fit=crop&w=500&q=80" },
            { id: 6, name: "ক্লাসিক স্পোর্টস শু", price: 2200, image: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=500&q=80" },
            { id: 7, name: "মডার্ন ব্যাকপ্যাক ব্যাগ", price: 1600, image: "https://images.unsplash.com/photo-1553062407-98eeb64c6a62?auto=format&fit=crop&w=500&q=80" },
            { id: 8, name: "ম্যাগনেটিক কার ফোন হোল্ডার", price: 650, image: "https://images.unsplash.com/photo-1584438784894-089d6a62b8fa?auto=format&fit=crop&w=500&q=80" },
            { id: 9, name: "পোর্টেবল মিনি ব্লেন্ডার", price: 1500, image: "https://images.unsplash.com/photo-1570222094114-d074f7e1e6e9?auto=format&fit=crop&w=500&q=80" },
            { id: 10, name: "এলইডি ডেট অ্যান্ড টাইম ডেস্ক ক্লক", price: 850, image: "https://images.unsplash.com/photo-1563861826100-9cb868fdbe1c?auto=format&fit=crop&w=500&q=80" },
            { id: 11, name: "স্টেইনলেস স্টিল ওয়াটার বোটল", price: 750, image: "https://images.unsplash.com/photo-1602143407151-7111542de6e8?auto=format&fit=crop&w=500&q=80" },
            { id: 12, name: "মিনি ইউএসবি ফ্যান", price: 550, image: "https://images.unsplash.com/photo-1585776245991-cf89dd7fc73a?auto=format&fit=crop&w=500&q=80" },
            { id: 13, name: "ইউনিক আর্ম রিস্ট রোলার", price: 900, image: "https://images.unsplash.com/photo-1517838277536-f5f99be501cd?auto=format&fit=crop&w=500&q=80" },
            { id: 14, name: "প্রিমিয়াম পারফিউম স্প্রে", price: 1400, image: "https://images.unsplash.com/photo-1523293182086-7651a899d37f?auto=format&fit=crop&w=500&q=80" },
            { id: 15, name: "কিচেন ডিজিটাল ফুড স্কেল", price: 700, image: "https://images.unsplash.com/photo-1589782182703-2aaa69037b5b?auto=format&fit=crop&w=500&q=80" }
        ];

        let selectedProduct = null;

        // রেন্ডার প্রোডাক্টস
        function renderProducts() {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = products.map(p => `
                <div class="bg-white rounded-xl shadow-sm hover:shadow-md transition overflow-hidden border border-gray-100 flex flex-col">
                    <img src="${p.image}" alt="${p.name}" class="w-full h-48 object-cover">
                    <div class="p-4 flex flex-col flex-grow">
                        <h3 class="font-semibold text-lg mb-1">${p.name}</h3>
                        <p class="text-indigo-600 font-bold text-lg mb-4">৳ ${p.price}</p>
                        <button onclick="openModal(${p.id})" class="mt-auto w-full bg-indigo-50 text-indigo-600 hover:bg-indigo-600 hover:text-white py-2 rounded-lg font-medium transition">অর্ডার করুন</button>
                    </div>
                </div>
            `).join('');
            document.getElementById('cart-count').innerText = products.length;
        }

        function openModal(id) {
            selectedProduct = products.find(p => p.id === id);
            document.getElementById('modal-product-name').innerText = `নির্বাচিত প্রোডাক্ট: ${selectedProduct.name} (মূল্য: ৳ ${selectedProduct.price})`;
            document.getElementById('checkout-modal').classList.remove('hidden');
            document.getElementById('checkout-modal').classList.add('flex');
        }

        function closeModal() {
            document.getElementById('checkout-modal').classList.remove('flex');
            document.getElementById('checkout-modal').classList.add('hidden');
        }

        function submitOrder(e) {
            e.preventDefault();
            const name = document.getElementById('cust-name').value;
            const phone = document.getElementById('cust-phone').value;
            const address = document.getElementById('cust-address').value;

            // ভবিষ্যতে এখানে WooCommerce REST API-এর মাধ্যমে ব্যাকএন্ডে ডেটা পাঠানো হবে
            alert(`ধন্যবাদ ${name}! আপনার অর্ডারটি সফলভাবে গৃহিত হয়েছে। প্রোডাক্ট: ${selectedProduct.name}`);
            
            document.getElementById('order-form').reset();
            closeModal();
        }

        // পেজ লোড হলে প্রোডাক্ট দেখাবে
        window.onload = renderProducts;
    </script>
</body>
</html>
