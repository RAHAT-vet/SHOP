<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আমার অনলাইন শপ - Headless Store</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Hind Siliguri', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">

    <!-- Header -->
    <header class="bg-white shadow-sm sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-indigo-600">🚀 আমার শপ</h1>
            <div class="text-sm bg-indigo-50 text-indigo-700 px-3 py-1.5 rounded-full font-medium">
                মোট প্রোডাক্ট: <span id="cart-count">০</span> টি
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-8">
        <div class="text-center mb-10">
            <h2 class="text-3xl font-bold mb-2">আমাদের এক্সক্লুসিভ প্রোডাক্টসমূহ</h2>
            <p class="text-gray-500">পছন্দের প্রোডাক্টটি বেছে নিন এবং সহজে অর্ডার করুন</p>
        </div>

        <!-- Product Grid -->
        <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <p class="text-center col-span-full text-gray-500 py-10">ওয়ার্ডপ্রেস ব্যাকএন্ড থেকে প্রোডাক্ট লোড হচ্ছে...</p>
        </div>
    </main>

    <!-- Custom Notification Toast (Replaces alert) -->
    <div id="toast-box" class="fixed bottom-5 right-5 bg-green-600 text-white px-6 py-4 rounded-xl shadow-lg transform translate-y-24 opacity-0 transition-all duration-300 z-50 max-w-sm">
        <p id="toast-message" class="font-medium"></p>
    </div>

    <!-- Checkout Modal -->
    <div id="checkout-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden justify-center items-center z-50 p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 relative shadow-xl">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 text-xl font-bold">×</button>
            <h3 class="text-xl font-bold mb-4">অর্ডার কনফার্ম করুন</h3>
            <p id="modal-product-name" class="text-indigo-600 font-semibold mb-4"></p>
            
            <form id="order-form" onsubmit="submitOrder(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">আপনার নাম</label>
                    <input type="text" id="cust-name" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">মোবাইল নম্বর</label>
                    <input type="tel" id="cust-phone" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">সম্পূর্ণ ঠিকানা</label>
                    <textarea id="cust-address" rows="3" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none"></textarea>
                </div>
                <button type="submit" id="submit-btn" class="w-full bg-indigo-600 text-white py-3 rounded-lg font-semibold hover:bg-indigo-700 transition">অর্ডার প্লেস করুন</button>
            </form>
        </div>
    </div>

    <!-- Script -->
    <script>
// ... existing code ... -->
        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast-box');
            toast.className = `fixed bottom-5 right-5 ${isError ? 'bg-red-600' : 'bg-green-600'} text-white px-6 py-4 rounded-xl shadow-lg transform transition-all duration-300 z-50 max-w-sm`;
            document.getElementById('toast-message').innerText = msg;
            toast.classList.remove('translate-y-24', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-24', 'opacity-0');
            }, 5000);
        }

        async function submitOrder(e) {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            const name = document.getElementById('cust-name').value;
            const phone = document.getElementById('cust-phone').value;
            const address = document.getElementById('cust-address').value;

            // বাটন লোডিং স্টেট
            btn.disabled = true;
            btn.innerText = 'অর্ডার পাঠানো হচ্ছে...';

            try {
                const response = await fetch('/api/order', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: name,
                        phone: phone,
                        address: address,
                        productId: selectedProduct.id
                    })
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    showToast(`ধন্যবাদ ${name}! আপনার অর্ডার (#${result.orderId}) সফলভাবে গৃহিত হয়েছে।`);
                    document.getElementById('order-form').reset();
                    closeModal();
                } else {
                    throw new Error(result.message || 'অর্ডার সাবমিট ব্যর্থ হয়েছে');
                }
            } catch (error) {
                showToast(`দুঃখিত! ${error.message}`, true);
            } finally {
                btn.disabled = false;
                btn.innerText = 'অর্ডার প্লেস করুন';
            }
        }

        // পেজ লোড হলেই এপিআই থেকে প্রোডাক্ট কল করবে
        window.onload = fetchProducts;
    </script>
</body>
</html>
